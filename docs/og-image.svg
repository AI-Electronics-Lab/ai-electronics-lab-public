      </text>

      <rect x="285" y="0" width="300" height="58" rx="29" fill="#1e293b" stroke="#64748b"/>
      <text x="435" y="38" text-anchor="middle" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900">
