    </text>

    <text x="0" y="118" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="900">
      AI Electronics
    </text>
    <text x="0" y="214" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="900">
