    <circle cx="420" cy="370" r="10" fill="#38bdf8"/>
    <circle cx="620" cy="300" r="10" fill="#38bdf8"/>
    <circle cx="835" cy="370" r="10" fill="#38bdf8"/>
  </g>

  <g transform="translate(82 92)">
    <text x="0" y="0" fill="#38bdf8" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" letter-spacing="4">
